[project]
name = "bustracker"
version = "0.1.0"
description = "Tracks Buses in Ireland Live"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
bustracker = "bustracker:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
