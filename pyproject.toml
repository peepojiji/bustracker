[project]
name = "bustracker"
version = "0.1.0"
description = "Tracks Buses in Ireland Live"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
    "flask>=3.1.0",
    "python-dotenv>=1.0.0",
    "rich>=15.0.0",
]

[project.scripts]
bustracker = "bustracker.cli:cli"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.taskipy.tasks]
lint = "ruff check --line-length 88 src/"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "taskipy>=1.14.1",
]
